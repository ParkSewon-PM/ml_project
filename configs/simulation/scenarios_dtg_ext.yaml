# DTG validation extension: cover SUMO OOD regions discovered in DTG cohort
#   - num_lanes 4, 5 (Korean expressway mainline often 4-5 lanes)
#   - speed_limit 110 km/h (당진영덕고속도로, 일부 본선 고속도로)
#
# Sampling: num_lanes ∈ {4, 5}, speed_limit ∈ {50, 60, 80, 100, 110}
# Note: passenger/truck params and demand identical to original scenarios.yaml.

simulation:
  sumo_binary: sumo
  max_workers: 13
  network:
    num_lanes:
      min: 4
      max: 5
    speed_limit_kmh: [50, 60, 80, 100, 110]
  demand:
    per_lane_min_vehph: 800
    per_lane_max_vehph: 2200
  vehicle_types:
    truck_ratio: {mean: 0.16, std: 0.05, min: 0.0, max: 0.40}
    passenger:
      tau: {mean: 1.45, std: 1.07, min: 0.2, max: 4.0}
      decel: {mean: 4.5, std: 1.0, min: 1.0, max: 7.0}
      minGap: {mean: 2.5, std: 0.8, min: 0.5, max: 6.0}
      speedFactor: {mean: 1.0, std: 0.1, min: 0.2, max: 2.0}
      sigma: {mean: 0.5, std: 0.15, min: 0.0, max: 1.0}
      accel: {mean: 2.6, std: 0.6, min: 1.0, max: 4.0}
      length: 4.5
    truck:
      tau: {mean: 1.45, std: 1.07, min: 0.2, max: 4.0}
      decel: {mean: 3.0, std: 0.8, min: 1.0, max: 5.0}
      minGap: {mean: 3.5, std: 1.0, min: 1.0, max: 8.0}
      speedFactor: {mean: 0.85, std: 0.08, min: 0.2, max: 1.5}
      sigma: {mean: 0.4, std: 0.1, min: 0.0, max: 1.0}
      accel: {mean: 1.3, std: 0.4, min: 0.5, max: 2.5}
      length: 12.0
  warmup_time: 200
  collect_time: 400
  num_probes: 5
  step_length: 1.0

scenarios:
  num_simulations: 4000

output:
  scenarios_csv: data/scenarios_dtg_lanes45.csv
  fcd_dir: data/fcd_dtg_lanes45/
  features_dir: data/features/
